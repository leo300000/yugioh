name: Construire et déployer le classeur

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # chaque lundi à 4 h UTC, pour récupérer les nouvelles extensions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Les images déjà téléchargées sont restaurées : seules les nouvelles sont récupérées
      - uses: actions/cache@v4
        with:
          path: .cache/img
          key: ygo-img-${{ github.run_id }}
          restore-keys: ygo-img-

      - name: Construire le site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
