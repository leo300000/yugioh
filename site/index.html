<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classeur Yu-Gi-Oh!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --binder: #1C1838;
  --page: #241F47;
  --sleeve: #2F2959;
  --edge: #463E7D;
  --ink: #ECE8F8;
  --muted: #A49DC8;
  --gold: #D9B65C;
  --holo: #9FD8E6;
  --waifu: #F2A7C9;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Alegreya Sans SC", "Alegreya Sans", "Gill Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--binder);
  color: var(--ink);
  font: 17px/1.45 var(--body);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Structure ---------- */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.spine { display: flex; flex-direction: column; min-height: 0; padding: 22px 14px 0 20px; }
.page {
  overflow-y: auto; min-height: 0;
  background: var(--page);
  margin: 10px 0;
  border-radius: 18px 0 0 18px;
  box-shadow: inset 12px 0 24px -16px rgba(8, 5, 28, .9);
  display: flex; flex-direction: column;
}

/* ---------- Tranche : liste des extensions ---------- */
.brand { font: 800 1.6rem/1 var(--display); text-decoration: none; letter-spacing: .01em; }
.brand span { display: block; font-size: .95rem; font-weight: 500; color: var(--gold); margin-top: 4px; }
.spine-head { display: grid; gap: 10px; padding-bottom: 14px; }
.spine-head .brand { margin-bottom: 8px; }
.waifu-link {
  display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 8px; text-decoration: none;
  background: var(--sleeve); border: 1px solid var(--edge); font-size: .95rem;
}
.waifu-link:hover { border-color: var(--waifu); }
.waifu-link[aria-current=page] { border-color: var(--waifu); color: var(--waifu); }
.waifu-link small { margin-left: auto; color: var(--muted); }
input[type=search], select {
  width: 100%; background: var(--page); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 11px;
}
input::placeholder { color: var(--muted); }
.sortf { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .92rem; }
.sortf select { flex: 1; }
.set-list { list-style: none; margin: 0 -6px 0 0; padding: 0 6px 24px 0; overflow-y: auto; flex: 1; scrollbar-width: thin; }
.set-list .year { font: 700 .95rem var(--display); color: var(--gold); padding: 16px 8px 4px; position: sticky; top: 0; background: var(--binder); }
.set-link {
  display: grid; grid-template-columns: 1fr auto; column-gap: 8px;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; border-left: 3px solid transparent;
}
.set-link:hover { background: rgba(255,255,255,.04); }
.set-link[aria-current=page] { background: var(--page); border-left-color: var(--gold); }
.sname { font-size: .95rem; line-height: 1.25; }
.scode { font: 500 .8rem var(--display); color: var(--muted); grid-column: 1; }
.scount { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--muted); font-size: .85rem; }
.empty { color: var(--muted); padding: 12px 8px; font-size: .95rem; }

/* ---------- Barre du haut ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; gap: 12px; align-items: center;
  padding: 14px clamp(16px, 4vw, 44px);
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(8px);
}
.topbar input { max-width: 520px; min-width: 0; flex: 1; }
.menu-btn { display: none; }
.lang { margin-left: auto; flex-shrink: 0; display: flex; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; background: none; padding: 0; cursor: pointer; }
.lang span { padding: 7px 11px; font: 700 .85rem var(--display); color: var(--muted); }
.lang span.on { background: var(--gold); color: var(--binder); }

/* ---------- Vues ---------- */
.view { padding: 8px clamp(16px, 4vw, 44px) 40px; flex: 1; }
.status { color: var(--muted); padding: 40px 0; }
.view-head { padding: 18px 0 22px; max-width: 70ch; }
.set-code { font: 800 1.1rem var(--display); color: var(--gold); margin: 0 0 6px; }
.title { font: 800 clamp(2rem, 4.2vw, 3.3rem)/1.02 var(--display); margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.lede { color: var(--muted); margin: 12px 0 0; }
.section { font: 700 1.25rem var(--display); margin: 8px 0 14px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 22px; }
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 9px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 14px; cursor: pointer; font-size: .95rem; }
.seg button + button { border-left: 1px solid var(--edge); }
.seg button[aria-pressed=true] { background: var(--sleeve); color: var(--gold); }
.seg small { color: var(--muted); margin-left: 4px; }
.seg button[data-kind=waifu][aria-pressed=true] { color: var(--waifu); }
.set-code.waifu { color: var(--waifu); }
.toolbar input { max-width: 280px; }

/* ---------- Pochettes et cartes ---------- */
.pockets {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px;
}
.pocket {
  padding: 10px 10px 12px; border-radius: 6px;
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
  border: 1px solid rgba(255,255,255,.06);
}
.card {
  display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
  perspective: 800px; position: relative;
}
.card-inner {
  display: block; position: relative; aspect-ratio: 59 / 86; overflow: hidden;
  border-radius: 4.5% / 3.1%;
  background: #15122E;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--s, 1));
  transition: transform .5s cubic-bezier(.2, .8, .2, 1), box-shadow .5s;
  box-shadow: 0 2px 6px rgba(5, 3, 20, .5);
  will-change: transform;
}
.card.tilting { z-index: 3; --s: 1.06; }
.card.tilting .card-inner {
  transition: transform .07s linear, box-shadow .2s;
  box-shadow: var(--shx, 0px) var(--shy, 12px) 26px rgba(5, 3, 20, .65);
}
.card-inner img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card:focus-visible { outline: none; }
.card:focus-visible .card-inner { outline: 3px solid var(--gold); outline-offset: 3px; }
.card-inner.missing::after {
  content: attr(data-name); position: absolute; inset: 0; display: grid; place-items: center;
  padding: 12px; text-align: center; color: var(--muted); font-size: .9rem; border: 1px dashed var(--edge); border-radius: inherit;
}
.glare, .foil { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s; }
.glare {
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.55), rgba(255,255,255,0) 58%);
  mix-blend-mode: soft-light;
}
.foil {
  background: linear-gradient(115deg, transparent 22%, rgba(255,80,170,.6) 36%, rgba(255,225,90,.6) 44%, rgba(80,255,200,.6) 52%, rgba(90,150,255,.6) 60%, transparent 76%);
  background-size: 260% 260%;
  background-position: var(--mx, 50%) var(--my, 50%);
  mix-blend-mode: color-dodge;
}
.card.tilting .glare { opacity: 1; }
.card.tilting[data-foil=holo] .foil { opacity: .35; }
.card.tilting[data-foil=secret] .foil { opacity: .75; filter: saturate(1.4); }

.print { display: flex; justify-content: space-between; gap: 8px; margin-top: 9px; font-size: .8rem; color: var(--muted); }
.print .code { font: 700 .82rem var(--display); color: var(--ink); white-space: nowrap; }
.print .rar { text-align: right; }
.rar.holo { color: var(--holo); }
.rar.secret { color: var(--gold); }
.cname { margin: 3px 0 0; font-size: .88rem; line-height: 1.25; }

.set-tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.set-tile { display: block; height: 100%; padding: 14px 16px; border-radius: 8px; text-decoration: none; background: var(--sleeve); border: 1px solid transparent; }
.set-tile:hover { border-color: var(--edge); }
.set-tile b { display: block; font: 800 1rem var(--display); color: var(--gold); }
.set-tile span { display: block; margin: 2px 0 6px; line-height: 1.25; }
.set-tile small { color: var(--muted); }
.more { color: var(--muted); margin-top: 20px; }

.foot { padding: 18px clamp(16px, 4vw, 44px) 24px; color: var(--muted); font-size: .82rem; border-top: 1px solid rgba(255,255,255,.06); }

/* ---------- Fiche carte ---------- */
dialog {
  border: 0; padding: 0; border-radius: 14px; background: var(--page); color: var(--ink);
  width: min(880px, 94vw); max-height: 90vh; box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
dialog::backdrop { background: rgba(10, 8, 28, .74); backdrop-filter: blur(3px); }
.dlg { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 30px; padding: 30px; max-height: 90vh; overflow-y: auto; }
.dlg .card { cursor: zoom-in; }
.zoom-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 12px;
  background: var(--sleeve); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: .92rem;
}
.zoom-btn:hover { border-color: var(--gold); }

/* ---------- Zoom ---------- */
#zoom {
  width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; border-radius: 0;
  background: rgba(8, 6, 22, .94); box-shadow: none;
}
#zoom::backdrop { background: rgba(8, 6, 22, .6); }
.zoom-stage {
  position: absolute; inset: 0; overflow: hidden; display: grid; place-items: center;
  cursor: zoom-in; touch-action: none;
}
.zoom-stage.zoomed { cursor: grab; }
.zoom-stage.dragging { cursor: grabbing; }
.zoom-stage img {
  display: block; height: min(calc(100dvh - 90px), 900px); width: auto; max-width: calc(100vw - 32px); object-fit: contain;
  border-radius: 4.5% / 3.1%; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  transform: translate(var(--zx, 0px), var(--zy, 0px)) scale(var(--zs, 1));
  transition: transform .25s ease; user-select: none; -webkit-user-drag: none;
}
.zoom-stage.dragging img { transition: none; }
.zoom-bar {
  position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2;
  display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 12px;
  background: rgba(36, 31, 71, .92); border: 1px solid var(--edge); backdrop-filter: blur(6px);
}
.zoom-bar button { background: var(--sleeve); border: 1px solid var(--edge); border-radius: 8px; min-width: 40px; padding: 6px 10px; cursor: pointer; }
.zoom-bar button:hover { border-color: var(--gold); }
.zoom-bar output { min-width: 52px; text-align: center; font: 700 .9rem var(--display); color: var(--muted); }
#zoom .close { z-index: 3; }
.zoom-name { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: 18px; right: 120px; z-index: 2; font: 700 1.1rem var(--display); margin: 0; }
.close { position: absolute; top: 12px; right: 12px; background: var(--sleeve); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.dlg h2 { font: 800 1.8rem/1.08 var(--display); margin: 0 60px 4px 0; text-wrap: balance; }
.alt { color: var(--muted); margin: 0 0 16px; font-style: italic; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; margin: 0 0 18px; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; }
.desc { white-space: pre-line; background: rgba(255,255,255,.04); border-radius: 8px; padding: 14px 16px; margin: 0 0 20px; max-width: 68ch; }
.desc.loading { color: var(--muted); }
.dlg h3 { font: 700 1.05rem var(--display); margin: 0 0 8px; }
.prints { list-style: none; margin: 0; padding: 0; columns: 2 220px; column-gap: 20px; }
.prints li { break-inside: avoid; padding: 3px 0; font-size: .92rem; }
.prints a { text-decoration: none; }
.prints a:hover .pn { text-decoration: underline; }
.prints b { font: 700 .85rem var(--display); margin-right: 6px; }
.prints .pr { color: var(--muted); }

/* ---------- Mobile ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .spine {
    position: fixed; inset: 0 auto 0 0; width: min(86vw, 330px); z-index: 30; background: var(--binder);
    padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateX(-102%); transition: transform .3s ease;
  }
  .app.nav-open .spine { transform: none; box-shadow: 20px 0 50px rgba(0,0,0,.5); }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(10,8,28,.6); }
  .page { margin: 0; border-radius: 0; }
  .menu-btn { display: block; background: var(--sleeve); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .pockets { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px 10px; }
  .dlg { grid-template-columns: 1fr; padding: 22px; }
  .dlg-card { width: min(230px, 70%); margin: 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  .card-inner, .glare, .foil, .spine, .zoom-stage img { transition: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="spine" id="spine" aria-label="Extensions">
    <div class="spine-head">
      <a class="brand" href="#/">Classeur <span>Yu-Gi-Oh!</span></a>
      <a class="waifu-link" id="waifu-link" href="#/waifu"><span aria-hidden="true">♡</span> Cartes waifu <small id="waifu-count"></small></a>
      <label><span class="sr">Filtrer les extensions</span><input id="set-filter" type="search" placeholder="Filtrer les extensions" autocomplete="off"></label>
      <label class="sortf"><span>Trier</span>
        <select id="set-sort">
          <option value="new">Plus récentes d'abord</option>
          <option value="old">Plus anciennes d'abord</option>
          <option value="alpha">Par nom</option>
        </select>
      </label>
    </div>
    <ul class="set-list" id="set-list"></ul>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="page" id="page">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" type="button" aria-controls="spine" aria-expanded="false">Extensions</button>
      <label class="sr" for="card-search">Chercher une carte</label>
      <input id="card-search" type="search" placeholder="Chercher une carte dans toutes les extensions" autocomplete="off">
      <button class="lang" id="lang-btn" type="button" title="Langue des noms de cartes"><span data-l="fr">FR</span><span data-l="en">EN</span></button>
    </div>
    <div id="view" class="view"><p class="status">Chargement du classeur…</p></div>
    <footer class="foot">
      Données et images : YGOPRODeck. Yu-Gi-Oh! et les visuels des cartes appartiennent à Konami et 4K Media. Site de fan non officiel, sans but commercial.
      <span id="built"></span>
    </footer>
  </main>
</div>

<dialog id="card-dialog" aria-labelledby="dlg-name">
  <div class="dlg">
    <button class="close" type="button" id="dlg-close">Fermer</button>
    <div class="dlg-card"><div id="dlg-card" title="Cliquer pour agrandir"></div><button class="zoom-btn" type="button" id="zoom-open"><span aria-hidden="true">🔍</span> Agrandir</button></div>
    <div class="dlg-info">
      <h2 id="dlg-name"></h2>
      <p class="alt" id="dlg-alt"></p>
      <dl class="stats" id="dlg-stats"></dl>
      <p class="desc" id="dlg-desc"></p>
      <h3>Présente dans</h3>
      <ul class="prints" id="dlg-prints"></ul>
    </div>
  </div>
</dialog>

<dialog id="zoom" aria-label="Carte agrandie">
  <p class="zoom-name" id="zoom-name"></p>
  <button class="close" type="button" id="zoom-close">Fermer</button>
  <div class="zoom-stage" id="zoom-stage"><img id="zoom-img" alt="" draggable="false"></div>
  <div class="zoom-bar">
    <button type="button" id="zoom-out" aria-label="Dézoomer">−</button>
    <output id="zoom-level">100 %</output>
    <button type="button" id="zoom-in" aria-label="Zoomer">+</button>
    <button type="button" id="zoom-reset">Ajuster</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  // Inclinaison : angle max en degrés, et sens (1 = le coin sous le curseur s'enfonce, -1 = il se soulève)
  const TILT_MAX = 14;
  const TILT_DIR = 1;

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const FRAME = { normal: 'Normal', effect: 'Effet', ritual: 'Rituel', fusion: 'Fusion', synchro: 'Synchro', xyz: 'Xyz', link: 'Lien', spell: 'Magie', trap: 'Piège', token: 'Jeton', skill: 'Compétence' };
  const ATTR = { DARK: 'Ténèbres', LIGHT: 'Lumière', EARTH: 'Terre', WATER: 'Eau', FIRE: 'Feu', WIND: 'Vent', DIVINE: 'Divin' };
  const KINDS = [['all', 'Tout'], ['monster', 'Monstres'], ['spell', 'Magies'], ['trap', 'Pièges'], ['waifu', 'Waifu ♡']];

  // Cartes « waifu » : monstres représentant un personnage féminin.
  // Aucune donnée de l'API ne l'indique, on combine donc des archétypes entièrement féminins,
  // des mots du nom anglais et quelques cartes isolées. Pour en ajouter, compléter ces trois listes.
  const WAIFU_ARCHETYPES = new Set([
    'Dragonmaid', 'Sky Striker', 'Witchcrafter', 'Lunalight', 'Live☆Twin', 'Evil★Twin', 'Amazoness',
    'Magician Girl', 'Prediction Princess', 'Fairy Tail', 'Melodious', 'Labrynth', 'Marincess', 'Aromage',
    'Exosister', 'Trickstar', 'Purrely', 'Mikanko', 'Rikka', 'Vernusylph', 'Altergeist', 'Cyber Angel',
    'Solfachord',
  ].map((a) => a.toLowerCase()));
  const WAIFU_WORDS = /\b(girl|lady|queen|princess|maiden|witch|priestess|sorceress|enchantress|empress|valkyries?|goddess|mermaid|siren|nun|diva|idol|bride|madame|mademoiselle|mistress|duchess|huntress|heroine|sister|matriarch|geisha|kunoichi|miko|dryad|nymph|succubus)\b/i;
  const WAIFU_CARDS = new Set([
    'Ash Blossom & Joyous Spring', 'Ghost Ogre & Snow Rabbit', 'Ghost Belle & Haunted Mansion',
    'Ghost Sister & Spooky Dogwood', 'Ghost Mourner & Moonlit Chill', 'Effect Veiler', 'Droll & Lock Bird',
    'Ib the World Chalice Justiciar', 'Dogmatika Ecclesia, the Virtuous', 'Elemental HERO Burstinatrix',
    'Tearlaments Merrli', 'Tearlaments Havnis', 'Tearlaments Kitkallos', 'Tearlaments Rulkallos',
    'Snake-Eyes Poplar', 'Snake-Eyes Diabellstar', 'Fiendsmith\'s Lacrima', 'Centur-Ion Primera',
    'Centur-Ion Trudea', 'Mystical Elf', 'Silent Magician', 'Ebon Magician Curran', 'White Magician Pikeru',
    'Dreaming Nemleria', 'I:P Masquerena', 'Elzette of the White Forest', 'Rucia of the White Forest',
    'Silvy of the White Forest',
  ]);
  // Charmers et leurs versions Possédées (Aussa, Eria, Hiita, Wynn, Lyna) ; Dharc, seul garçon, est exclu
  const WAIFU_NAMES = /^(Familiar-Possessed - )?(Aussa|Eria|Hiita|Wynn|Lyna)\b/;
  const isWaifu = (c) => {
    if (kindOf(c) !== 'monster' || c.f === 'token') return false;
    if (WAIFU_CARDS.has(c.n) || WAIFU_NAMES.test(c.n)) return true;
    if (c.ar && WAIFU_ARCHETYPES.has(c.ar.toLowerCase())) return true;
    return WAIFU_WORDS.test(c.n);
  };
  const SEARCH_LIMIT = 150;

  const state = {
    sets: [], setById: new Map(), cards: {}, prints: new Map(), index: [], waifus: [], texts: null, meta: {},
    lang: store.get('ygo-lang') === 'en' ? 'en' : 'fr',
    sort: ['new', 'old', 'alpha'].includes(store.get('ygo-sort')) ? store.get('ygo-sort') : 'new',
    current: null, view: 'home', kind: 'all', filter: '',
  };

  const view = $('#view');
  const kindOf = (c) => (/Spell/.test(c.t) ? 'spell' : /Trap/.test(c.t) ? 'trap' : 'monster');
  const nameOf = (c) => (state.lang === 'fr' ? c.nf || c.n : c.n);
  const altNameOf = (c) => (state.lang === 'fr' ? (c.nf ? c.n : '') : c.nf || '');
  const frameLabel = (f = '') => (FRAME[f.replace('_pendulum', '')] || f) + (f.endsWith('_pendulum') ? ' Pendule' : '');
  const fmtDate = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '');
  const plural = (n, one, many) => `${n.toLocaleString('fr-FR')} ${n > 1 ? many : one}`;
  function foilOf(r = '') {
    if (/secret|ultimate|ghost|starlight|collector|quarter century|prismatic|platinum|gold|10000/i.test(r)) return 'secret';
    if (/ultra|super|holo|parallel|mosaic|shatterfoil|starfoil/i.test(r)) return 'holo';
    return '';
  }

  // ---------- Rendu des cartes ----------
  function cardFace(c, foil, tag = 'span') {
    const name = nameOf(c);
    return `<${tag === 'button' ? 'button type="button"' : 'div'} class="card" data-id="${c.id}" data-foil="${foil}"${tag === 'button' ? ` aria-label="${esc(name)}"` : ''}>` +
      `<span class="card-inner" data-name="${esc(name)}"><img src="img/${c.i}.webp" alt="${tag === 'button' ? '' : esc(name)}" loading="lazy" decoding="async" width="421" height="614">` +
      `${foil ? '<span class="foil"></span>' : ''}<span class="glare"></span></span></${tag === 'button' ? 'button' : 'div'}>`;
  }
  function pocket(id, code, rarity, note) {
    const c = state.cards[id];
    if (!c) return '';
    const foil = foilOf(rarity);
    return `<li class="pocket">${cardFace(c, foil, 'button')}` +
      `<div class="print"><span class="code">${esc(code)}</span><span class="rar ${foil}">${esc(note ?? rarity)}</span></div>` +
      `<p class="cname">${esc(nameOf(c))}</p></li>`;
  }

  // ---------- Tranche ----------
  function renderSpine() {
    const q = norm($('#set-filter').value);
    const list = state.sets.filter((s) => !q || s.search.includes(q));
    if (state.sort === 'old') list.sort((a, b) => (a.d ? 0 : 1) - (b.d ? 0 : 1) || (a.d || '').localeCompare(b.d || ''));
    else if (state.sort === 'alpha') list.sort((a, b) => a.n.localeCompare(b.n, 'en', { numeric: true }));
    let html = '';
    let year = null;
    for (const s of list) {
      if (state.sort !== 'alpha') {
        const y = s.d ? s.d.slice(0, 4) : 'Date inconnue';
        if (y !== year) { html += `<li class="year" role="presentation">${y}</li>`; year = y; }
      }
      html += `<li><a class="set-link" href="#/set/${encodeURIComponent(s.id)}"${state.current === s ? ' aria-current="page"' : ''}>` +
        `<span class="sname">${esc(s.n)}</span><span class="scode">${esc(s.c)}</span><span class="scount">${s.k.length}</span></a></li>`;
    }
    if (state.view === 'waifu') $('#waifu-link').setAttribute('aria-current', 'page');
    else $('#waifu-link').removeAttribute('aria-current');
    $('#set-list').innerHTML = html || '<li class="empty">Aucune extension ne correspond. Essaie un code comme LOB ou un autre mot du nom.</li>';
  }

  // ---------- Vues ----------
  function showHome() {
    state.current = null;
    state.view = 'home';
    document.title = 'Classeur Yu-Gi-Oh!';
    const latest = state.sets.filter((s) => s.d).slice(0, 12);
    const built = state.meta.builtAt ? ` Données mises à jour le ${fmtDate(state.meta.builtAt.slice(0, 10))}.` : '';
    view.innerHTML = `<header class="view-head"><h1 class="title">Toutes les cartes, rangées par extension</h1>` +
      `<p class="lede">${plural(Object.keys(state.cards).length, 'carte', 'cartes')} dans ${plural(state.sets.length, 'extension', 'extensions')}. Choisis une extension dans la liste ou cherche une carte par son nom.${built}</p></header>` +
      `<p><a class="waifu-link" href="#/waifu" style="display:inline-flex"><span aria-hidden="true">♡</span> Voir les ${plural(state.waifus.length, 'carte waifu', 'cartes waifu')}</a></p>` +
      `<h2 class="section">Dernières sorties</h2><ul class="set-tiles">` +
      latest.map((s) => `<li><a class="set-tile" href="#/set/${encodeURIComponent(s.id)}"><b>${esc(s.c)}</b><span>${esc(s.n)}</span><small>${fmtDate(s.d)}, ${plural(s.k.length, 'carte', 'cartes')}</small></a></li>`).join('') +
      `</ul>`;
    renderSpine();
  }

  function showSet(set) {
    state.current = set;
    state.view = 'set';
    state.kind = 'all';
    state.filter = '';
    document.title = `${set.n} – Classeur Yu-Gi-Oh!`;
    const counts = { all: set.k.length, monster: 0, spell: 0, trap: 0, waifu: 0 };
    for (const [id] of set.k) {
      const c = state.cards[id];
      if (!c) continue;
      counts[kindOf(c)]++;
      if (c.w) counts.waifu++;
    }
    const date = set.d ? `Sortie le ${fmtDate(set.d)}, ` : '';
    view.innerHTML = `<header class="view-head"><p class="set-code">${esc(set.c)}</p><h1 class="title">${esc(set.n)}</h1>` +
      `<p class="lede">${date}${plural(set.k.length, 'carte', 'cartes')}.</p></header>` +
      `<div class="toolbar"><div class="seg" role="group" aria-label="Type de carte">` +
      KINDS.filter(([k]) => k === 'all' || counts[k]).map(([k, label]) => `<button type="button" data-kind="${k}" aria-pressed="${k === 'all'}">${label}<small>${counts[k]}</small></button>`).join('') +
      `</div><input type="search" id="in-set" placeholder="Filtrer cette extension" aria-label="Filtrer cette extension" autocomplete="off"></div>` +
      `<ul class="pockets" id="grid"></ul>`;
    renderSetGrid();
    renderSpine();
    $('#page').scrollTop = 0;
  }

  function renderSetGrid() {
    const set = state.current;
    const q = norm(state.filter);
    const rows = set.k.filter(([id, code]) => {
      const c = state.cards[id];
      if (!c) return false;
      if (state.kind === 'waifu' ? !c.w : state.kind !== 'all' && kindOf(c) !== state.kind) return false;
      return !q || norm(c.n + ' ' + (c.nf || '') + ' ' + code).includes(q);
    });
    $('#grid').innerHTML = rows.map(([id, code, r]) => pocket(id, code, r)).join('') ||
      '<li class="empty">Aucune carte ne correspond à ce filtre.</li>';
  }

  function showSearch(raw) {
    state.current = null;
    state.view = 'search';
    const q = norm(raw);
    const hits = state.index.filter(([, s]) => s.includes(q)).map(([id]) => id);
    hits.sort((a, b) => {
      const na = norm(nameOf(state.cards[a])), nb = norm(nameOf(state.cards[b]));
      return (nb.startsWith(q) - na.startsWith(q)) || na.localeCompare(nb);
    });
    const shown = hits.slice(0, SEARCH_LIMIT);
    const sub = hits.length > SEARCH_LIMIT ? `Les ${SEARCH_LIMIT} premières sur ${plural(hits.length, 'carte', 'cartes')}. Précise ta recherche pour affiner.` : plural(hits.length, 'carte trouvée', 'cartes trouvées') + '.';
    view.innerHTML = `<header class="view-head"><h1 class="title">« ${esc(raw.trim())} »</h1><p class="lede">${sub}</p></header>` +
      (hits.length ? `<ul class="pockets">` + shown.map(cardPocket).join('') + `</ul>` : `<p class="status">Aucune carte ne porte ce nom. Vérifie l'orthographe ou essaie dans l'autre langue (bouton FR / EN).</p>`);
    renderSpine();
  }

  // Pochette d'une carte hors extension : première impression connue, ou nombre d'impressions
  function cardPocket(id) {
    const p = state.prints.get(id) || [];
    const note = p.length ? plural(p.length, 'impression', 'impressions') : 'hors extension';
    return pocket(id, p[0]?.[1] || '', '', note);
  }

  function showWaifu() {
    state.current = null;
    state.view = 'waifu';
    state.filter = '';
    document.title = 'Cartes waifu – Classeur Yu-Gi-Oh!';
    view.innerHTML = `<header class="view-head"><p class="set-code waifu">♡ Sélection</p><h1 class="title">Cartes waifu</h1>` +
      `<p class="lede">${plural(state.waifus.length, 'monstre', 'monstres')} représentant un personnage féminin, toutes extensions confondues. ` +
      `La sélection est automatique (archétypes, mots du nom), quelques cartes peuvent manquer ou s'y glisser par erreur.</p></header>` +
      `<div class="toolbar"><input type="search" id="in-waifu" placeholder="Filtrer les cartes waifu" aria-label="Filtrer les cartes waifu" autocomplete="off"></div>` +
      `<ul class="pockets" id="grid"></ul>`;
    renderWaifuGrid();
    renderSpine();
    $('#page').scrollTop = 0;
  }

  function renderWaifuGrid() {
    const q = norm(state.filter);
    const list = state.waifus.filter((id) => {
      const c = state.cards[id];
      return !q || norm(c.n + ' ' + (c.nf || '') + ' ' + (c.ar || '')).includes(q);
    });
    list.sort((a, b) => norm(nameOf(state.cards[a])).localeCompare(norm(nameOf(state.cards[b]))));
    $('#grid').innerHTML = list.map(cardPocket).join('') || '<li class="empty">Aucune carte ne correspond à ce filtre.</li>';
  }

  function route() {
    const q = $('#card-search').value;
    if (norm(q).length >= 2) return showSearch(q);
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash === '/waifu') return showWaifu();
    const m = hash.match(/^\/set\/(.+)$/);
    const set = m && state.setById.get(m[1]);
    set ? showSet(set) : showHome();
  }

  // ---------- Fiche carte ----------
  const dlg = $('#card-dialog');
  async function openCard(id, foil) {
    const c = state.cards[id];
    if (!c) return;
    $('#dlg-card').innerHTML = cardFace(c, foil, 'div');
    zoomCard = c;
    $('#dlg-name').textContent = nameOf(c);
    $('#dlg-alt').textContent = altNameOf(c);
    $('#dlg-alt').hidden = !altNameOf(c);
    const rows = [['Type', frameLabel(c.f) + (c.r ? ` – ${c.r}` : '')]];
    if (c.a) rows.push(['Attribut', ATTR[c.a] || c.a]);
    if (c.f === 'link') rows.push(['Lien', c.lv]);
    else if (c.l != null) rows.push([c.f?.startsWith('xyz') ? 'Rang' : 'Niveau', c.l]);
    if (c.sc != null) rows.push(['Échelle', c.sc]);
    if (c.atk != null) rows.push([c.f === 'link' ? 'ATK' : 'ATK / DEF', c.f === 'link' ? c.atk : `${c.atk} / ${c.def ?? '?'}`]);
    if (c.ar) rows.push(['Archétype', c.ar]);
    $('#dlg-stats').innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
    const prints = state.prints.get(id) || [];
    $('#dlg-prints').innerHTML = prints.map(([set, code, r]) =>
      `<li><a href="#/set/${encodeURIComponent(set.id)}" data-close><b>${esc(code)}</b><span class="pn">${esc(set.n)}</span></a> <span class="pr">${esc(r)}</span></li>`).join('') ||
      '<li class="pr">Cette carte n\'apparaît dans aucune extension du classeur.</li>';
    const desc = $('#dlg-desc');
    if (!dlg.open) dlg.showModal();
    if (!state.texts) {
      desc.textContent = 'Chargement du texte…';
      desc.classList.add('loading');
      try { state.texts = await (await fetch('data/texts.json')).json(); }
      catch { desc.textContent = 'Le texte de la carte n\'a pas pu être chargé. Recharge la page pour réessayer.'; return; }
    }
    const t = state.texts[id] || [];
    desc.classList.remove('loading');
    desc.textContent = (state.lang === 'fr' ? t[1] || t[0] : t[0]) || '';
  }
  $('#dlg-close').addEventListener('click', () => dlg.close());

  // ---------- Zoom ----------
  // Clic ou molette pour zoomer, glisser pour se déplacer, pincer sur mobile, Échap pour fermer
  const zoom = $('#zoom'), stage = $('#zoom-stage'), zimg = $('#zoom-img');
  const Z_MIN = 1, Z_MAX = 4;
  const z = { s: 1, x: 0, y: 0 };
  function paintZoom() {
    z.s = Math.min(Math.max(z.s, Z_MIN), Z_MAX);
    if (z.s === 1) { z.x = 0; z.y = 0; }
    // L'image ne sort jamais complètement du cadre
    const w = zimg.offsetWidth, h = zimg.offsetHeight;
    const mx = Math.max(0, (w * z.s - stage.clientWidth) / 2 + 40), my = Math.max(0, (h * z.s - stage.clientHeight) / 2 + 40);
    z.x = Math.min(Math.max(z.x, -mx), mx);
    z.y = Math.min(Math.max(z.y, -my), my);
    zimg.style.setProperty('--zs', z.s);
    zimg.style.setProperty('--zx', z.x + 'px');
    zimg.style.setProperty('--zy', z.y + 'px');
    stage.classList.toggle('zoomed', z.s > 1);
    $('#zoom-level').value = Math.round(z.s * 100) + ' %';
  }
  // Zoome en gardant fixe le point (cx, cy) de l'écran
  function zoomAt(next, cx, cy) {
    const r = stage.getBoundingClientRect();
    const px = (cx ?? r.left + r.width / 2) - (r.left + r.width / 2), py = (cy ?? r.top + r.height / 2) - (r.top + r.height / 2);
    const k = Math.min(Math.max(next, Z_MIN), Z_MAX) / z.s;
    z.x = px - (px - z.x) * k;
    z.y = py - (py - z.y) * k;
    z.s *= k;
    paintZoom();
  }
  function openZoom(c) {
    zimg.src = `img/${c.i}.webp`;
    zimg.alt = nameOf(c);
    $('#zoom-name').textContent = nameOf(c);
    z.s = 1;
    paintZoom();
    zoom.showModal();
  }
  let zoomCard = null;
  $('#zoom-open').addEventListener('click', () => zoomCard && openZoom(zoomCard));
  $('#dlg-card').addEventListener('click', () => zoomCard && openZoom(zoomCard));
  $('#zoom-close').addEventListener('click', () => zoom.close());
  $('#zoom-in').addEventListener('click', () => zoomAt(z.s * 1.5));
  $('#zoom-out').addEventListener('click', () => zoomAt(z.s / 1.5));
  $('#zoom-reset').addEventListener('click', () => { z.s = 1; paintZoom(); });
  stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(z.s * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });

  const pts = new Map();
  let drag = null, moved = false, pinch = null;
  stage.addEventListener('pointerdown', (e) => {
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: z.s };
      drag = null;
    } else drag = { x: e.clientX - z.x, y: e.clientY - z.y };
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
      moved = true;
    } else if (drag && z.s > 1) {
      const nx = e.clientX - drag.x, ny = e.clientY - drag.y;
      if (Math.abs(nx - z.x) + Math.abs(ny - z.y) > 3) { moved = true; stage.classList.add('dragging'); }
      z.x = nx; z.y = ny;
      paintZoom();
    }
  });
  function endPointer(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (!pts.size) {
      stage.classList.remove('dragging');
      // Simple clic : zoom ×2 sur le point cliqué, ou retour à l'ajustement
      if (!moved && drag && e.type === 'pointerup') z.s > 1 ? (z.s = 1, paintZoom()) : zoomAt(2.5, e.clientX, e.clientY);
      drag = null;
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  addEventListener('resize', () => zoom.open && paintZoom());
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg || e.target.closest('[data-close]')) {
      if (e.target.closest('[data-close]')) $('#card-search').value = '';
      dlg.close();
    }
  });

  // ---------- Inclinaison au survol ----------
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let active = null, lastEv = null, raf = 0;
  function resetTilt(card) {
    card.classList.remove('tilting');
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
  }
  function applyTilt() {
    raf = 0;
    if (!active || !lastEv) return;
    const r = active.getBoundingClientRect();
    const px = Math.min(Math.max((lastEv.clientX - r.left) / r.width, 0), 1);
    const py = Math.min(Math.max((lastEv.clientY - r.top) / r.height, 0), 1);
    const s = active.style;
    s.setProperty('--ry', ((px - 0.5) * 2 * TILT_MAX * TILT_DIR).toFixed(2) + 'deg');
    s.setProperty('--rx', ((0.5 - py) * 2 * TILT_MAX * TILT_DIR).toFixed(2) + 'deg');
    s.setProperty('--mx', (px * 100).toFixed(1) + '%');
    s.setProperty('--my', (py * 100).toFixed(1) + '%');
    s.setProperty('--shx', ((0.5 - px) * 18).toFixed(1) + 'px');
    s.setProperty('--shy', (12 + (0.5 - py) * 14).toFixed(1) + 'px');
  }
  document.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch' || reduceMotion.matches) return;
    const card = e.target.closest ? e.target.closest('.card') : null;
    if (card !== active) {
      if (active) resetTilt(active);
      active = card;
      if (card) card.classList.add('tilting');
    }
    if (!card) return;
    lastEv = e;
    if (!raf) raf = requestAnimationFrame(applyTilt);
  }, { passive: true });
  document.addEventListener('pointerout', (e) => {
    if (!e.relatedTarget && active) { resetTilt(active); active = null; }
  });

  // Image absente : on affiche le nom à la place
  document.addEventListener('error', (e) => {
    const inner = e.target.tagName === 'IMG' && e.target.closest('.card-inner');
    if (inner) { inner.classList.add('missing'); e.target.remove(); }
  }, true);

  // ---------- Événements ----------
  const app = $('#app');
  function setNav(open) {
    app.classList.toggle('nav-open', open);
    $('#scrim').hidden = !open;
    $('#menu-btn').setAttribute('aria-expanded', String(open));
  }
  $('#menu-btn').addEventListener('click', () => setNav(true));
  $('#scrim').addEventListener('click', () => setNav(false));
  $('#set-list').addEventListener('click', (e) => {
    if (e.target.closest('a')) { $('#card-search').value = ''; setNav(false); }
  });
  $('#waifu-link').addEventListener('click', () => { $('#card-search').value = ''; setNav(false); });
  view.addEventListener('click', (e) => { if (e.target.closest('.waifu-link')) $('#card-search').value = ''; });
  $('#set-filter').addEventListener('input', renderSpine);
  const sortSel = $('#set-sort');
  sortSel.value = state.sort;
  sortSel.addEventListener('change', () => { state.sort = sortSel.value; store.set('ygo-sort', state.sort); renderSpine(); });

  let searchTimer = 0;
  $('#card-search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(route, 160); });

  view.addEventListener('click', (e) => {
    const card = e.target.closest('button.card');
    if (card) return openCard(Number(card.dataset.id), card.dataset.foil);
    const seg = e.target.closest('[data-kind]');
    if (seg) {
      state.kind = seg.dataset.kind;
      view.querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b === seg)));
      renderSetGrid();
    }
  });
  view.addEventListener('input', (e) => {
    if (e.target.id === 'in-set') { state.filter = e.target.value; renderSetGrid(); }
    if (e.target.id === 'in-waifu') { state.filter = e.target.value; renderWaifuGrid(); }
  });

  function paintLang() {
    document.querySelectorAll('#lang-btn span').forEach((s) => s.classList.toggle('on', s.dataset.l === state.lang));
  }
  $('#lang-btn').addEventListener('click', () => {
    state.lang = state.lang === 'fr' ? 'en' : 'fr';
    store.set('ygo-lang', state.lang);
    paintLang();
    if (state.current) {
      const { kind, filter } = state;
      showSet(state.current);
      state.kind = kind; state.filter = filter;
      view.querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kind)));
      $('#in-set').value = filter;
      renderSetGrid();
    } else if (state.view === 'waifu') {
      const { filter } = state;
      showWaifu();
      state.filter = filter;
      $('#in-waifu').value = filter;
      renderWaifuGrid();
    } else route();
  });
  window.addEventListener('hashchange', route);

  // ---------- Chargement ----------
  (async () => {
    paintLang();
    try {
      const [sets, cards, meta] = await Promise.all(['sets', 'cards', 'meta'].map((f) =>
        fetch(`data/${f}.json`).then((r) => { if (!r.ok) throw new Error(f); return r.json(); })));
      state.cards = cards;
      state.meta = meta;
      for (const [id, c] of Object.entries(cards)) {
        c.id = Number(id);
        state.index.push([c.id, norm(c.n + ' ' + (c.nf || ''))]);
        if (isWaifu(c)) { c.w = true; state.waifus.push(c.id); }
      }
      state.sets = sets;
      for (const s of sets) {
        s.search = norm(s.n + ' ' + s.c);
        state.setById.set(s.id, s);
        for (const [id, code, r] of s.k) {
          if (!state.prints.has(id)) state.prints.set(id, []);
          state.prints.get(id).push([s, code, r]);
        }
      }
      for (const list of state.prints.values()) list.sort((a, b) => (a[0].d || '9999').localeCompare(b[0].d || '9999'));
      $('#waifu-count').textContent = state.waifus.length.toLocaleString('fr-FR');
      if (meta.builtAt) $('#built').textContent = ` Mise à jour : ${fmtDate(meta.builtAt.slice(0, 10))}.`;
      route();
    } catch {
      view.innerHTML = '<p class="status">Les données du classeur sont introuvables. Lance <code>node scripts/build.mjs</code>, puis sers le dossier <code>dist/</code>.</p>';
    }
  })();
})();
</script>
</body>
</html>
